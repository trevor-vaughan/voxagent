# The image-backed differential gates (docs/dev/gates.md), weekly and on demand.
#
# These are excluded from `task check` because each builds the fleet images
# from the CentOS Stream mirrors and runs for minutes, so they are not run per
# pull request. Each gate builds its own images: sharing them across jobs would
# need a save/load artifact of several hundred MiB for little wall-clock gain.
#
# Exit code 2 from a gate means "could not run", never a pass; the job fails on
# it like any other non-zero exit. For dev:state-diff and
# dev:report-diff-container a likely 2 is openvox drift: the images install the
# newest openvox, and those two refuse to compare against a version other than
# their WANT_PUPPET pin. Re-measure before bumping the pin
# (docs/maintainers/apply-spine.md).
#
# Not run here, deliberately:
#   dev:report-diff-systemd, dev:report-diff-simp -- boot systemd under rootless
#     podman, which needs a delegated cgroup subtree the runner does not set up.
#   dev:report-diff-selinux -- boots a CentOS VM under QEMU from a 1 GiB image.
name: gates-containers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: gates-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate:
          - dev:state-diff
          - dev:report-diff-container
          - dev:sensitive-canary
          - dev:augeas-lib
          - dev:agent-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # podman ships on the runner image; podman-compose is for dev:agent-gate.
      - name: Install podman-compose
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman-compose

      - name: Build fleet images
        run: task fleet:images

      - name: Run ${{ matrix.gate }}
        env:
          GATE: ${{ matrix.gate }}
        run: task "$GATE"

      - name: Name the artifact
        if: always()
        env:
          GATE: ${{ matrix.gate }}
        run: echo "ARTIFACT=test-output-${GATE//:/-}" >> "$GITHUB_ENV"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: .test-output/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
