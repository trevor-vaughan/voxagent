# Turns on GitHub auto-merge for Dependabot's patch and minor updates. GitHub
# then merges the PR only once the branch ruleset's required checks pass, so
# the checks, not this workflow, are what stop a bad update. If `main` has no
# required checks, auto-merge merges as soon as the PR is mergeable: configure
# the ruleset before relying on this (docs/dev/testing.md).
#
# Major updates are left for a person to review and merge.
#
# pull_request_target, not pull_request: on pull_request, Dependabot's runs get
# a read-only token, which cannot enable auto-merge. pull_request_target runs
# this file as it is on `main` with a writable token, so this job must never
# check out or execute anything from the PR. It only reads Dependabot's
# metadata and calls the API.
name: dependabot-auto-merge

on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only PRs whose head branch lives in this repository: pull_request_target
    # hands fork PRs a writable token too, so a fork is refused outright rather
    # than left to the author and signature checks. A deleted fork has a null
    # head.repo, which also fails the comparison.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'trevor-vaughan/voxagent' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Also verifies that the PR's commit was signed by Dependabot, so a PR
      # merely opened under that name does not get through.
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
