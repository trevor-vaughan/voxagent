# Quality gates for every push to main and every pull request.
#
# `task check` is the repository's own definition of "green" (Taskfile.yml);
# this workflow runs it unchanged rather than restating its gates, so adding a
# gate to `check` adds it here too. The same job then runs the Venom suite
# (task integration:venom). The jobs beside it cover what `check` does
# not: data races, known-vulnerability reachability and new golangci-lint
# findings.
#
# Go 1.27 is not tested yet: on 1.27 the pycompat digit test fails
# because Go's Unicode tables are newer than the CPython 3.12 it mirrors.
#
# The image-backed gates are in gates-containers.yml; they take minutes and
# build images, which is why `check` excludes them too.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # go.mod's `go 1.26.5` is a language floor, not the toolchain to ship on:
  # 1.26.5 carries reachable standard-library vulnerabilities that later 1.26
  # patches fix. `1.26.x` with check-latest takes the newest 1.26 patch.
  GO_VERSION: '1.26.x'
  # The extension-host tests and the report differentials compare against
  # Ruby Puppet. These are the gem versions the gates were last measured with
  # locally; moving them is a re-measurement, not a routine bump. Ruby itself
  # is the CentOS Stream 10 package.
  PUPPET_GEM_VERSION: '8.10.0'
  FACTER_GEM_VERSION: '4.10.0'

jobs:
  check:
    name: task check
    runs-on: ubuntu-24.04
    # The tests assume the platform the native units were measured on (RHEL
    # family 10); on Ubuntu User, Cron and Sshkey route to the extension host
    # instead and the leak tests cannot reach their native paths.
    container: quay.io/centos/centos:stream10
    timeout-minutes: 30
    env:
      # The agent tests make scratch dirs under os.UserCacheDir, and `agent`
      # refuses any path with an ancestor not owned by root or the running
      # user. In a container job HOME is /github/home, the host runner's
      # (uid 1001) bind mount, while the job runs as root; /root is root's.
      XDG_CACHE_HOME: /root/.cache
    steps:
      # Before checkout: it and the Go cache need git and tar in the image.
      # gcc: the native units use cgo; without a C compiler Go disables cgo and
      # -race is refused.
      # rubygem-racc: Puppet's parser needs racc, a bundled gem the dnf ruby omits;
      # the RPM avoids building the gem's C extension (needs ruby-devel, make).
      - name: Install system packages
        run: |
          dnf install -y epel-release
          dnf install -y git tar gzip ruby rubygem-racc ShellCheck gcc
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # The module has no dependencies and so no go.sum; key the build
          # cache on go.mod instead of the default go.sum.
          cache-dependency-path: go.mod

      - name: Install Puppet (the Ruby oracle)
        run: gem install --no-document "facter:$FACTER_GEM_VERSION" "puppet:$PUPPET_GEM_VERSION"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: task check
        run: task check

      # Venom publishes no checksum file; this digest was measured from the
      # v1.3.0 release asset, and a changed asset fails the step.
      - name: Install Venom
        env:
          VENOM_URL: https://github.com/ovh/venom/releases/download/v1.3.0/venom.linux-amd64
          VENOM_SHA256: 89832ec25e820c605cf0d3c09122e60bad43d13c1724aa6d375ef7109fbfe201
        run: |
          curl -fsSL -o "$RUNNER_TEMP/venom" "$VENOM_URL"
          echo "$VENOM_SHA256  $RUNNER_TEMP/venom" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/venom" /usr/local/bin/venom

      - name: task integration:venom
        run: task integration:venom

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-check
          path: .test-output/
          include-hidden-files: true
          retention-days: 14

  race:
    name: go test -race
    runs-on: ubuntu-24.04
    # The tests assume the platform the native units were measured on (RHEL
    # family 10); on Ubuntu User, Cron and Sshkey route to the extension host
    # instead and the leak tests cannot reach their native paths.
    container: quay.io/centos/centos:stream10
    timeout-minutes: 30
    env:
      # As in scripts/run-tests.sh: the extension-host tests must not pass by
      # skipping for want of a Ruby that can load Puppet.
      VOXAGENT_REQUIRE_RUBY: '1'
      # As in the check job: HOME is the runner's uid-1001 bind mount.
      XDG_CACHE_HOME: /root/.cache
    steps:
      # Before checkout: it and the Go cache need git and tar in the image.
      # gcc: the native units use cgo; without a C compiler Go disables cgo and
      # -race is refused.
      # rubygem-racc: Puppet's parser needs racc, a bundled gem the dnf ruby omits;
      # the RPM avoids building the gem's C extension (needs ruby-devel, make).
      - name: Install system packages
        run: |
          dnf install -y git tar gzip ruby rubygem-racc gcc
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.mod

      - name: Install Puppet (the Ruby oracle)
        run: gem install --no-document "facter:$FACTER_GEM_VERSION" "puppet:$PUPPET_GEM_VERSION"

      - name: go test -race
        run: go test -race -count=1 ./...

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.mod

      # Scans against the toolchain set up above, so a standard-library fix
      # that has not reached GO_VERSION's newest patch shows up here.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  golangci-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # only-new-issues reads the pull request's diff through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.mod

      # only-new-issues: the tree carries a backlog of findings under the
      # default linters (errcheck, staticcheck, unused). New code is held to
      # them; the backlog is fixed separately rather than hidden by config.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          only-new-issues: true
