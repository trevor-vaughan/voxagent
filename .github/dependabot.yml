# The workflows pin every action to a commit SHA; this keeps those pins moving.
# Go modules are not listed: the module has no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Patch and minor bumps are auto-merged (dependabot-auto-merge.yml), and an
    # action runs with the workflow's token. A release must be a week old before
    # it is proposed, so a compromised one has time to be caught and pulled.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
