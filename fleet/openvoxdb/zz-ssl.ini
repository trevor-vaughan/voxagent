[jetty]
ssl-host = 0.0.0.0
ssl-port = 8081
ssl-cert = /etc/puppetlabs/puppetdb/openvoxdb.crt
ssl-key = /etc/puppetlabs/puppetdb/openvoxdb.key
ssl-ca-cert = /etc/puppetlabs/puppetdb/ca.crt

# Note what this does and does not prove. The shipped jetty.ini sets
# `client-auth = want` and must not be overridden here (Trapperkeeper rejects
# duplicate keys across conf.d and OpenVoxDB then refuses to start), so a node
# presenting no client certificate, or a wrong one, still connects. The nodes
# are issued per-node client certificates and do present them, but nothing in
# this harness verifies that mTLS is enforced. The server-side trust chain is
# real -- the nodes validate this certificate against the fleet CA -- and that
# is the property gate check 4 depends on.
