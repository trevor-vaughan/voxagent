---
version: 5

defaults:
  datadir: hieradata
  data_hash: yaml_data

hierarchy:
  # A lookup_key backend rather than a data file: it re-reads and evaluates
  # Ruby from disk on every lookup and recurses back into hiera, which is the
  # hardest thing the two-field allowlist has to survive. First in the
  # hierarchy so every key in the environment passes through it.
  - name: "Compliance markup enforcement"
    lookup_key: compliance_markup::enforcement

  - name: "Per-node data"
    path: "nodes/%{facts.networking.hostname}.yaml"

  - name: "OS family data"
    path: "os/%{facts.os.family}.yaml"

  - name: "Common data"
    path: "common.yaml"
