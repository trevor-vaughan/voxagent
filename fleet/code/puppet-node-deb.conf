[main]
certname = node-deb
localcacert = /etc/puppetlabs/puppet/fleet-ssl/ca.crt
hostcrl = /etc/puppetlabs/puppet/fleet-ssl/ca.crl
hostcert = /etc/puppetlabs/puppet/fleet-ssl/node-deb.crt
hostprivkey = /etc/puppetlabs/puppet/fleet-ssl/node-deb.key
storeconfigs = true
storeconfigs_backend = puppetdb
